name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-and-web:
    name: Server and web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Validate Python and protocol configuration
        run: |
          python -m json.tool server/protocol_config.json >/dev/null
          python -m py_compile server/relay_server.py server/protocol.py server/test_multitenant.py

      - name: Run multi-tenant integration tests
        run: python server/test_multitenant.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate embedded web JavaScript
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('web/index.html','utf8');new Function(h.slice(h.indexOf('<script>')+8,h.lastIndexOf('</script>')));console.log('FRONTEND_JS_OK')"

      - name: Install Chromium for visual test
        run: python -m playwright install --with-deps chromium

      - name: Run responsive visual checks
        run: |
          python -m http.server 43871 --directory web >/tmp/funf-web.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:43871/ >/dev/null && break
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/funf-web.log
              exit 1
            fi
            sleep 0.5
          done
          python web/visual_test.py

      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-screenshots
          path: .test-runtime/visual/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        working-directory: android/FunfRelayApp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
